name: Autofix preflight Ruff

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/workflow-input-preflight
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Apply safe Ruff fixes
        shell: bash
        run: |
          set -euo pipefail
          ruff check . --fix || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Apply safe Ruff modernization fixes"
          git push origin "HEAD:feature/workflow-input-preflight"
