name: Cleanup preflight temporary files

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/workflow-input-preflight
      - name: Remove temporary maintenance files
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/diagnose-preflight-ruff.yml \
            .github/workflows/autofix-preflight-ruff.yml \
            .github/workflows/apply-preflight-manual-ruff-fixes.yml \
            .github/workflows/apply-final-preflight-fixes.yml \
            .github/workflows/apply-final-preflight-fixes.yml \
            .ruff-preflight-diagnostics.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove temporary preflight maintenance files"
          git push origin "HEAD:feature/workflow-input-preflight"
