name: Diagnose preflight Ruff

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/workflow-input-preflight
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Capture Ruff diagnostics after safe fixes
        shell: bash
        run: |
          set +e
          ruff check . --output-format concise > .ruff-preflight-diagnostics.txt 2>&1
          status=$?
          echo "exit_code=$status" >> .ruff-preflight-diagnostics.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ruff-preflight-diagnostics.txt
          git commit -m "Refresh preflight Ruff diagnostics"
          git push origin "HEAD:feature/workflow-input-preflight"
