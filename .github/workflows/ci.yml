name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python scripts/audit_public_repository.py

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --constraint requirements/ci-validation.txt -e ".[dev]"
      - run: ruff check .
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --tb=short \
            --junitxml=pytest-${{ matrix.python-version }}.xml \
            2>&1 | tee pytest-${{ matrix.python-version }}.log
      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-failure-${{ matrix.python-version }}
          path: |
            pytest-${{ matrix.python-version }}.xml
            pytest-${{ matrix.python-version }}.log
          if-no-files-found: warn
          retention-days: 7


  server-api:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: >-
          python -m pip install --constraint requirements/ci-validation.txt
          -e ".[dev,server,server-test]"
      - run: >-
          ruff check src/starshine_server examples/server_handoff.py
          tests/test_server_api.py tests/test_server_execution.py
          tests/test_server_handoff.py tests/test_server_workbench.py
          tests/test_server_architecture.py
      - name: Check Workbench JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in src/starshine_server/static/*.js; do
            node --input-type=module --check < "$file"
          done
      - name: Exercise Workbench authoring logic
        run: node tests/workbench_authoring.mjs
      - name: Exercise Workbench input guidance
        run: node tests/workbench_guidance.mjs
      - run: >-
          python -m pytest -q tests/test_server_api.py
          tests/test_server_execution.py tests/test_server_handoff.py
          tests/test_server_workbench.py tests/test_server_architecture.py

  geopackage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --constraint requirements/ci-validation.txt -e ".[dev,geopackage]"
      - run: ruff check .
      - name: Run GeoPackage tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --tb=short \
            --junitxml=pytest-geopackage.xml \
            2>&1 | tee pytest-geopackage.log
      - name: Upload GeoPackage test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-failure-geopackage
          path: |
            pytest-geopackage.xml
            pytest-geopackage.log
          if-no-files-found: warn
          retention-days: 7

  benchmark:
    needs: [repository-audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --constraint requirements/ci-validation.txt -e ".[dev]"
      - run: python -m benchmarks.verify
      - run: python -m benchmarks.run --repeat 1 --output benchmark-report.json
      - run: python scripts/check_benchmark_report.py benchmark-report.json
      - run: >-
          python -m benchmarks.spatial_index --repeat 1
          --output spatial-index-report.json
      - run: python scripts/check_spatial_index_benchmark.py spatial-index-report.json
      - uses: actions/upload-artifact@v7
        with:
          name: starshine-vector-benchmark
          path: |
            benchmark-report.json
            spatial-index-report.json
          if-no-files-found: error
          retention-days: 14

  source-reproduction:
    needs: [repository-audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --constraint requirements/ci-validation.txt -e ".[dev]"
      - name: Verify tracked public workflow evidence
        run: python scripts/refresh_public_evidence.py
      - name: Run path-free doctor
        run: starshine doctor --format json --output doctor-report.json
      - name: Reproduce the public core from self-created data
        run: python scripts/reproduce_installed_core.py --output reproduction-report.json
      - name: Validate reproduction report schema and semantics
        run: python scripts/check_reproduction_report.py reproduction-report.json
      - uses: actions/upload-artifact@v7
        with:
          name: starshine-source-reproduction
          path: |
            doctor-report.json
            reproduction-report.json
          if-no-files-found: error
          retention-days: 14

  build:
    needs: [repository-audit, test, server-api, geopackage, benchmark, source-reproduction]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --constraint requirements/ci-validation.txt -e ".[release]"
      - run: python scripts/check_release_readiness.py
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Inspect release artifacts
        shell: bash
        run: |
          set -o pipefail
          python scripts/check_release_artifacts.py dist \
            2>&1 | tee release-artifact-check.log
      - name: Build portable independent reproduction bundle
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find dist -name '*.whl' -print -quit)"
          revision="$(git rev-parse HEAD)"
          test -n "$wheel"
          python scripts/independent_reproduction.py bundle \
            --wheel "$wheel" \
            --revision "$revision" \
            --output independent-reproduction.zip
      - name: Upload release inspection diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-artifact-inspection-failure
          path: |
            release-artifact-check.log
            dist/
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: starshine-geo-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: starshine-independent-reproduction-bundle
          path: independent-reproduction.zip
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: starshine-wheel-smoke-scripts
          path: |
            scripts/smoke_installed_wheel.py
            scripts/smoke_installed_preflight_sarif.py
            scripts/smoke_installed_geometry_quality.py
            scripts/smoke_installed_geopackage.py
            scripts/smoke_installed_server.py
            scripts/reproduce_installed_core.py
          if-no-files-found: error
          retention-days: 14

  independent-reproduction-bundle-smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v8
        with:
          name: starshine-independent-reproduction-bundle
          path: bundle-artifact
      - name: Extract and run the portable reproduction bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir bundle
          python -c "import pathlib, zipfile; p=next(pathlib.Path('bundle-artifact').glob('*.zip')); zipfile.ZipFile(p).extractall('bundle')"
          python bundle/scripts/independent_reproduction.py run --output-dir bundle-evidence
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: independent-reproduction-bundle-smoke
          path: bundle-evidence/
          if-no-files-found: warn
          retention-days: 14

  wheel-smoke:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v8
        with:
          name: starshine-geo-dist
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: starshine-wheel-smoke-scripts
          path: smoke
      - name: Install the built wheel
        shell: bash
        run: |
          set -o pipefail
          python -m pip install --upgrade pip \
            2>&1 | tee wheel-install-${{ matrix.python-version }}.log
          python -m pip install dist/*.whl \
            2>&1 | tee -a wheel-install-${{ matrix.python-version }}.log
      - name: Run installed-wheel smoke checks and self-created reproduction
        shell: bash
        run: |
          set -o pipefail
          core_script="$(find smoke -name smoke_installed_wheel.py -print -quit)"
          sarif_script="$(find smoke -name smoke_installed_preflight_sarif.py -print -quit)"
          quality_script="$(find smoke -name smoke_installed_geometry_quality.py -print -quit)"
          reproduce_script="$(find smoke -name reproduce_installed_core.py -print -quit)"
          test -n "$core_script"
          test -n "$sarif_script"
          test -n "$quality_script"
          test -n "$reproduce_script"
          python "$core_script" \
            2>&1 | tee wheel-smoke-${{ matrix.python-version }}.log
          python "$sarif_script" \
            2>&1 | tee wheel-sarif-smoke-${{ matrix.python-version }}.log
          python "$quality_script" \
            2>&1 | tee wheel-quality-smoke-${{ matrix.python-version }}.log
          python "$reproduce_script" \
            --output reproduction-report-${{ matrix.python-version }}.json \
            2>&1 | tee wheel-reproduction-${{ matrix.python-version }}.log
      - name: Upload wheel-smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: wheel-smoke-failure-${{ matrix.python-version }}
          path: |
            wheel-install-${{ matrix.python-version }}.log
            wheel-smoke-${{ matrix.python-version }}.log
            wheel-sarif-smoke-${{ matrix.python-version }}.log
            wheel-quality-smoke-${{ matrix.python-version }}.log
            wheel-reproduction-${{ matrix.python-version }}.log
            reproduction-report-${{ matrix.python-version }}.json
          if-no-files-found: warn
          retention-days: 7

  geopackage-wheel-smoke:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v8
        with:
          name: starshine-geo-dist
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: starshine-wheel-smoke-scripts
          path: smoke
      - name: Install the built wheel with the GeoPackage extra
        shell: bash
        run: |
          set -o pipefail
          wheel="$(find dist -name '*.whl' -print -quit)"
          test -n "$wheel"
          python -m pip install --upgrade pip \
            2>&1 | tee gpkg-wheel-install-${{ matrix.python-version }}.log
          python -m pip install "${wheel}[geopackage]" \
            2>&1 | tee -a gpkg-wheel-install-${{ matrix.python-version }}.log
      - name: Run installed-wheel GeoPackage workflow and reproduction checks
        shell: bash
        run: |
          set -o pipefail
          script="$(find smoke -name smoke_installed_geopackage.py -print -quit)"
          reproduce_script="$(find smoke -name reproduce_installed_core.py -print -quit)"
          test -n "$script"
          test -n "$reproduce_script"
          python "$script" \
            2>&1 | tee gpkg-wheel-smoke-${{ matrix.python-version }}.log
          python "$reproduce_script" \
            --require-geopackage \
            --output gpkg-reproduction-report-${{ matrix.python-version }}.json \
            2>&1 | tee gpkg-reproduction-${{ matrix.python-version }}.log
      - name: Upload GeoPackage Preflight wheel diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gpkg-wheel-failure-${{ matrix.python-version }}
          path: |
            gpkg-wheel-install-${{ matrix.python-version }}.log
            gpkg-wheel-smoke-${{ matrix.python-version }}.log
            gpkg-reproduction-${{ matrix.python-version }}.log
            gpkg-reproduction-report-${{ matrix.python-version }}.json
          if-no-files-found: warn
          retention-days: 7


  server-wheel-smoke:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v8
        with:
          name: starshine-geo-dist
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: starshine-wheel-smoke-scripts
          path: smoke
      - name: Install exact wheel with optional server dependencies
        run: |
          python -m pip install --upgrade pip
          python -c "import pathlib, subprocess, sys; wheel = next(pathlib.Path('dist').rglob('*.whl')); subprocess.check_call([sys.executable, '-m', 'pip', 'install', str(wheel) + '[server]', 'httpx>=0.28,<1'])"
      - name: Run installed server smoke
        run: >-
          python -c "import pathlib, subprocess, sys;
          script = next(pathlib.Path('smoke').rglob('smoke_installed_server.py'));
          subprocess.check_call([sys.executable, str(script)])"
      - name: Upload server smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: server-wheel-failure-${{ matrix.os }}-${{ matrix.python-version }}
          path: server-wheel-smoke-*.log
          if-no-files-found: warn
          retention-days: 7

  cross-platform-reproduction:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v8
        with:
          name: starshine-geo-dist
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: starshine-wheel-smoke-scripts
          path: smoke
      - name: Install the exact CI-built wheel
        run: |
          python -m pip install --upgrade pip
          python -c "import pathlib, subprocess, sys; wheel = next(pathlib.Path('dist').rglob('*.whl')); subprocess.check_call([sys.executable, '-m', 'pip', 'install', str(wheel)])"
      - name: Reproduce the installed core without a source checkout
        run: >-
          python -c "import pathlib, subprocess, sys;
          script = next(pathlib.Path('smoke').rglob('reproduce_installed_core.py'));
          subprocess.check_call([sys.executable, str(script), '--output', 'reproduction-report.json'])"
      - name: Upload cross-platform reproduction evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reproduction-${{ matrix.os }}
          path: reproduction-report.json
          if-no-files-found: warn
          retention-days: 14

  ci-gate:
    name: ci-gate
    if: always()
    needs:
      - repository-audit
      - test
      - server-api
      - geopackage
      - benchmark
      - source-reproduction
      - build
      - independent-reproduction-bundle-smoke
      - wheel-smoke
      - geopackage-wheel-smoke
      - server-wheel-smoke
      - cross-platform-reproduction
    runs-on: ubuntu-latest
    steps:
      - name: Require all CI jobs to succeed
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["CI_RESULTS"])
          failed = {
              name: details.get("result")
              for name, details in needs.items()
              if details.get("result") != "success"
          }
          if failed:
              for name, result in sorted(failed.items()):
                  print(f"{name}: {result}")
              sys.exit(1)

          print("All required CI jobs succeeded.")
          PY

