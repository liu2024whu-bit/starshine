name: Latest Compatible Dependencies

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: latest-compatible-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-latest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Install latest compatible development tools
        run: python -m pip install --upgrade -e ".[dev]"
      - name: Record resolved validation tools
        run: python -m pip show ruff pytest jsonschema
      - run: python scripts/audit_public_repository.py
      - run: ruff check .
      - run: pytest -q --tb=short

  release-latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Install latest compatible release tools
        run: python -m pip install --upgrade -e ".[release]"
      - name: Record resolved release tools
        run: python -m pip show build twine
      - run: python scripts/check_release_readiness.py
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/check_release_artifacts.py dist
