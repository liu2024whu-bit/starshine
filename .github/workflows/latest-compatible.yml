name: Latest Compatible Dependencies

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "pyproject.toml"
      - "requirements/ci-validation.txt"
      - ".github/workflows/latest-compatible.yml"
      - "scripts/check_release_readiness.py"
      - "scripts/check_release_artifacts.py"
      - "scripts/refresh_public_evidence.py"

permissions:
  contents: read

concurrency:
  group: latest-compatible-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-latest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Install latest compatible development tools
        run: python -m pip install --upgrade -e ".[dev,server,server-test]"
      - name: Record resolved validation tools
        run: python -m pip show ruff pytest jsonschema fastapi pydantic uvicorn httpx
      - run: python scripts/audit_public_repository.py
      - run: ruff check .
      - run: python -m pytest -q --tb=short

  release-latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Install latest compatible release tools
        run: python -m pip install --upgrade -e ".[release]"
      - name: Record resolved release tools
        run: python -m pip show build twine
      - run: python scripts/check_release_readiness.py
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/check_release_artifacts.py dist
