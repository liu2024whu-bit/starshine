name: Apply preflight manual Ruff fixes

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/workflow-input-preflight
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Apply reviewed fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/verify_teaching_examples.py")
          text = path.read_text(encoding="utf-8")
          old = 'raise RuntimeError(f"expected an object in {path}")'
          new = 'raise TypeError(f"expected an object in {path}")'
          if text.count(old) != 1:
              raise SystemExit("unexpected teaching verifier exception context")
          path.write_text(text.replace(old, new), encoding="utf-8")

          path = Path("src/starshine_geo/contracts.py")
          text = path.read_text(encoding="utf-8")
          old = '''                    f"### Step {use['step_index']}: {inline_code(use['operation'], quote_strings=False)} / "
                    f"{inline_code(use['input_name'], quote_strings=False)}",'''
          new = '''                    (
                        f"### Step {use['step_index']}: "
                        f"{inline_code(use['operation'], quote_strings=False)} / "
                        f"{inline_code(use['input_name'], quote_strings=False)}"
                    ),'''
          if text.count(old) != 1:
              raise SystemExit("unexpected workflow contract heading context")
          path.write_text(text.replace(old, new), encoding="utf-8")

          path = Path("src/starshine_geo/operator_registry.py")
          text = path.read_text(encoding="utf-8")
          old_import = "from dataclasses import dataclass"
          new_import = "from dataclasses import dataclass, field"
          old_default = "    contract: InputContractSpec = InputContractSpec()"
          new_default = "    contract: InputContractSpec = field(default_factory=InputContractSpec)"
          if text.count(old_import) != 1 or text.count(old_default) != 1:
              raise SystemExit("unexpected operator registry dataclass context")
          text = text.replace(old_import, new_import).replace(old_default, new_default)
          path.write_text(text, encoding="utf-8")
          PY
          ruff check .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify_teaching_examples.py src/starshine_geo/contracts.py src/starshine_geo/operator_registry.py
          git commit -m "Fix remaining Ruff modernization findings"
          git push origin "HEAD:feature/workflow-input-preflight"
